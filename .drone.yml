kind: pipeline
clone:
  disable: true
name: bspay-php-sdk-test
trigger:
  branch: release*
node:
  instance: 172.31.13.13
steps:
  - name: system_start_webhook
    image: plugins/webhook
    settings:
      method: GET
      debug: true
      urls: 'http://172.31.13.13:18080/webHook/startStep'
  - name: sonarcheck_build_sonarcheck
    image: hoc/drone-sonar_report
    when:
      event: promote
      target: sonarcheck
    settings:
      self_useself: '2'
      self_useaop: '2'
      sonar_id: bspay-php-sdk
  - name: manual test_other_manual
    image: hoc/drone-manual_check
    when:
      event: promote
      target: manual test
    settings:
      scheduler: []
      role:
        - 2
        - 3
        - 4
        - 7
      choose: group
  - name: system_finish_webhook
    image: plugins/webhook
    settings:
      method: GET
      debug: true
      urls: 'http://172.31.13.13:18080/webHook/endStep'
    when:
      status:
        - failure
        - success
